model:
  type: token-retrieval
  path: Qwen/Qwen2-7B-Instruct
  rope_base: 1000000
  rope_scale: 1
  n_init: 128
  n_local: 512
  top_k: 8192
  max_n_tokens: 1048576
  adaptive_topk: true
  attention_threshold: 0.9
  l2_norm_pooling: false
  weighted_soft_vote: false
  union_of_sets: false
  dynamic_capacity_union: false
  head_wise_adaptive: false
  dcu_energy_mode: "both"
  prefill_chunk_size: 512
  sim_threshold: 0.95
  max_dynamic_chunk: 4096
  use_dynamic_chunking: false
  dynamic_budget_balancing: false
  use_cumsum_adaptive: false
  use_hybrid_adaptive: false
  cumsum_threshold: 0.0000000000000001
  n_tail: 4096
  ppl_mode: thresh

max_len: 1048576
chunk_size: 8192
conv_type: qwen
truncation: suffix
dtype: bfloat16
